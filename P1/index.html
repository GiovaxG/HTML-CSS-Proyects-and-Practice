<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet"> 
    <title>Social Link- CSS-Flexbox</title>
</head>
<body>
    <div id="body_social">
        <header>
            <img src="avatar-jessica.jpeg" alt="" id="img_avatar">
            <h1>Jessica Randall</h1>     
        </header>
        <nav>
            <h2 id="h2_ubi">London, United Kingdom</h2> 
            <h2 id="h2_prof">"Frond-End developer and avid reader"</h2>
        </nav>
        <main>
            <div class="social_link"><a href="" target="_blank" >GitHub</a></div>
            <div class="social_link"><a href="" target="_blank" >Frondend Mentor</a></div>
            <div class="social_link"><a href="" target="_blank" >Linkedin</a></div>
            <div class="social_link"><a href="" target="_blank" >Twitter</a></div>
            <div class="social_link"><a href="" target="_blank" >Instagram</a></div>
        </main>
    </div>
</body>
</html>
